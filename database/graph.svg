<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16A34A"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#2E5A8F"/>
    </linearGradient>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    <linearGradient id="publicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#065F46"/>
      <stop offset="100%" style="stop-color:#064E3B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1100" fill="#F3F4F6" rx="10"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="1400" height="60" fill="url(#headerGrad)" rx="10"/>
  <rect x="0" y="30" width="1400" height="30" fill="url(#headerGrad)"/>
  <text x="700" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="bold">DATABASE: brunchio_db — Schema Relationship Diagram</text>

  <!-- SCHEMA: dev_dba -->
  <rect x="30" y="80" width="640" height="980" fill="#DBEAFE" stroke="#1E40AF" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <rect x="30" y="80" width="640" height="40" fill="url(#devGrad)" rx="8"/>
  <rect x="30" y="110" width="640" height="10" fill="url(#devGrad)"/>
  <text x="350" y="106" text-anchor="middle" fill="white" font-size="18" font-weight="bold">SCHEMA: dev_dba</text>

  <!-- SCHEMA: public -->
  <rect x="730" y="80" width="640" height="980" fill="#D1FAE5" stroke="#065F46" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <rect x="730" y="80" width="640" height="40" fill="url(#publicGrad)" rx="8"/>
  <rect x="730" y="110" width="640" height="10" fill="url(#publicGrad)"/>
  <text x="1050" y="106" text-anchor="middle" fill="white" font-size="18" font-weight="bold">SCHEMA: public</text>

  <!-- ==================== dev_dba TABLES ==================== -->

  <!-- users table -->
  <rect x="55" y="140" width="280" height="280" fill="white" stroke="#2563EB" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="55" y="140" width="280" height="32" fill="#2563EB" rx="6"/>
  <rect x="55" y="166" width="280" height="6" fill="#2563EB"/>
  <text x="195" y="162" text-anchor="middle" fill="white" font-size="14" font-weight="bold">users</text>
  <text x="65" y="192" fill="#1F2937" font-size="11">🔑 PK │ id (bigserial)</text>
  <text x="65" y="208" fill="#1F2937" font-size="11">🔑 UK │ name (TEXT) UNIQUE</text>
  <text x="65" y="224" fill="#6B7280" font-size="10">   │ role (TEXT)</text>
  <text x="65" y="240" fill="#6B7280" font-size="10">   │ password (TEXT)</text>
  <text x="65" y="256" fill="#6B7280" font-size="10">   │ email (TEXT)</text>
  <text x="65" y="272" fill="#6B7280" font-size="10">   │ liked (int[])</text>
  <text x="65" y="288" fill="#6B7280" font-size="10">   │ viewed (int[])</text>
  <text x="65" y="304" fill="#6B7280" font-size="10">   │ friend_list (TEXT[])</text>
  <text x="65" y="320" fill="#6B7280" font-size="10">   │ request_list (TEXT[])</text>
  <text x="65" y="336" fill="#6B7280" font-size="10">   │ is_author (TEXT[])</text>
  <text x="65" y="352" fill="#6B7280" font-size="10">   │ created_at (timestamptz)</text>
  <text x="65" y="368" fill="#6B7280" font-size="10">   │ updated_at (timestamptz)</text>
  <text x="65" y="384" fill="#6B7280" font-size="10">   │ last_login (timestamptz)</text>
  <text x="65" y="400" fill="#6B7280" font-size="10">   │ is_active (boolean)</text>
  <text x="65" y="416" fill="#6B7280" font-size="10">   │ two_factor_enabled (boolean)</text>

  <!-- ingredients table -->
  <rect x="365" y="140" width="280" height="210" fill="white" stroke="#2563EB" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="365" y="140" width="280" height="32" fill="#2563EB" rx="6"/>
  <rect x="365" y="166" width="280" height="6" fill="#2563EB"/>
  <text x="505" y="162" text-anchor="middle" fill="white" font-size="14" font-weight="bold">ingredients</text>
  <text x="375" y="192" fill="#1F2937" font-size="11">🔑 PK │ id (bigserial)</text>
  <text x="375" y="208" fill="#1F2937" font-size="11">🔑 UK │ name (TEXT) UNIQUE</text>
  <text x="375" y="224" fill="#6B7280" font-size="10">   │ price_per_kg (numeric)</text>
  <text x="375" y="240" fill="#6B7280" font-size="10">   │ diet_type (TEXT)</text>
  <text x="375" y="256" fill="#6B7280" font-size="10">   │ last_update (date)</text>
  <text x="375" y="272" fill="#6B7280" font-size="10">   │ unit (TEXT) DEFAULT 'Kg'</text>
  <line x1="375" y1="285" x2="635" y2="285" stroke="#E5E7EB" stroke-width="1"/>
  <text x="375" y="300" fill="#DC2626" font-size="10" font-style="italic">⏱ TRIGGER: set_updated_timestamp</text>
  <text x="375" y="316" fill="#DC2626" font-size="10" font-style="italic">   (BEFORE INSERT/UPDATE)</text>
  <text x="375" y="332" fill="#7C3AED" font-size="10">   → update_timestamp()</text>

  <!-- recipe_ingredients table -->
  <rect x="55" y="440" width="280" height="170" fill="white" stroke="#2563EB" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="55" y="440" width="280" height="32" fill="#2563EB" rx="6"/>
  <rect x="55" y="466" width="280" height="6" fill="#2563EB"/>
  <text x="195" y="462" text-anchor="middle" fill="white" font-size="14" font-weight="bold">recipe_ingredients</text>
  <text x="65" y="492" fill="#1F2937" font-size="11">🔗 FK │ recipe_id (bigint)</text>
  <text x="65" y="508" fill="#1F2937" font-size="11">🔗 FK │ ingredient_id (bigint)</text>
  <text x="65" y="524" fill="#6B7280" font-size="10">   │ name (TEXT)</text>
  <text x="65" y="540" fill="#6B7280" font-size="10">   │ quantity (numeric)</text>
  <text x="65" y="556" fill="#6B7280" font-size="10">   │ unit (TEXT)</text>
  <line x1="65" y1="570" x2="325" y2="570" stroke="#E5E7EB" stroke-width="1"/>
  <text x="65" y="586" fill="#1F2937" font-size="10" font-weight="bold">🔑 PK: (recipe_id, ingredient_id)</text>

  <!-- all_recipes (dev_dba) -->
  <rect x="365" y="380" width="280" height="310" fill="white" stroke="#2563EB" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="365" y="380" width="280" height="32" fill="#2563EB" rx="6"/>
  <rect x="365" y="406" width="280" height="6" fill="#2563EB"/>
  <text x="505" y="402" text-anchor="middle" fill="white" font-size="14" font-weight="bold">all_recipes</text>
  <text x="375" y="432" fill="#1F2937" font-size="11">🔑 PK │ id (bigserial)</text>
  <text x="375" y="448" fill="#1F2937" font-size="11">🔑 UK │ name (TEXT) UNIQUE</text>
  <text x="375" y="464" fill="#1F2937" font-size="11">🔗 FK │ author (TEXT) → users(name)</text>
  <text x="375" y="480" fill="#6B7280" font-size="10">   │ diet (TEXT)</text>
  <text x="375" y="496" fill="#6B7280" font-size="10">   │ ingredients (JSONB)</text>
  <text x="375" y="512" fill="#6B7280" font-size="10">   │ instructions (TEXT)</text>
  <text x="375" y="528" fill="#6B7280" font-size="10">   │ cost (numeric)</text>
  <text x="375" y="544" fill="#6B7280" font-size="10">   │ is_public (boolean)</text>
  <text x="375" y="560" fill="#6B7280" font-size="10">   │ prep_time / cooking_time</text>
  <text x="375" y="576" fill="#6B7280" font-size="10">   │ liked / viewed (int)</text>
  <line x1="375" y1="590" x2="635" y2="590" stroke="#E5E7EB" stroke-width="1"/>
  <text x="375" y="606" fill="#DC2626" font-size="10" font-style="italic">⏱ TRIGGER: trigger_replicate_</text>
  <text x="375" y="622" fill="#DC2626" font-size="10" font-style="italic">   all_recipes_update (AFTER U)</text>
  <text x="375" y="638" fill="#DC2626" font-size="10" font-style="italic">⏱ TRIGGER: on_approval (AFTER U)</text>
  <text x="375" y="654" fill="#DC2626" font-size="10" font-style="italic">   WHEN (is_public = true)</text>
  <text x="375" y="674" fill="#7C3AED" font-size="10">   → replicate_all_recipes_update()</text>
  <text x="375" y="690" fill="#7C3AED" font-size="10">   → export_to_public()</text>

  <!-- Functions box (dev_dba) -->
  <rect x="55" y="630" width="280" height="200" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5" rx="6" filter="url(#shadow)"/>
  <text x="195" y="652" text-anchor="middle" fill="#6B21A8" font-size="12" font-weight="bold">⚙ dev_dba FUNCTIONS / PROCEDURES</text>
  <line x1="65" y1="662" x2="325" y2="662" stroke="#7C3AED" stroke-width="1"/>
  <text x="65" y="682" fill="#6B21A8" font-size="10" font-weight="bold">🔹 pricing_list()</text>
  <text x="75" y="698" fill="#6B7280" font-size="9">   Updates all_recipes.cost from</text>
  <text x="75" y="714" fill="#6B7280" font-size="9">   ingredients.price_per_kg</text>
  <text x="65" y="736" fill="#6B21A8" font-size="10" font-weight="bold">🔹 update_recipe_ingredients_as_jsonb()</text>
  <text x="75" y="752" fill="#6B7280" font-size="9">   Denormalizes recipe_ingredients</text>
  <text x="75" y="768" fill="#6B7280" font-size="9">   → all_recipes.ingredients (JSONB)</text>
  <text x="65" y="790" fill="#6B21A8" font-size="10" font-weight="bold">🔹 set_all_recipes_public()</text>
  <text x="75" y="806" fill="#6B7280" font-size="9">   Mass sets is_public = true</text>
  <text x="75" y="822" fill="#6B7280" font-size="9">   Returns row count</text>

  <!-- ==================== public TABLES ==================== -->

  <!-- all_recipes (public) -->
  <rect x="755" y="140" width="280" height="280" fill="white" stroke="#16A34A" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="755" y="140" width="280" height="32" fill="#16A34A" rx="6"/>
  <rect x="755" y="166" width="280" height="6" fill="#16A34A"/>
  <text x="895" y="162" text-anchor="middle" fill="white" font-size="14" font-weight="bold">all_recipes</text>
  <text x="765" y="192" fill="#1F2937" font-size="11">🔑 PK │ id (bigserial)</text>
  <text x="765" y="208" fill="#1F2937" font-size="11">🔑 UK │ name (TEXT) UNIQUE</text>
  <text x="765" y="224" fill="#1F2937" font-size="11">🔗 FK │ author (TEXT) → dev_dba.users</text>
  <text x="765" y="240" fill="#6B7280" font-size="10">   │ diet (TEXT)</text>
  <text x="765" y="256" fill="#6B7280" font-size="10">   │ ingredients (JSONB)</text>
  <text x="765" y="272" fill="#6B7280" font-size="10">   │ instructions (TEXT)</text>
  <text x="765" y="288" fill="#6B7280" font-size="10">   │ cost (numeric)</text>
  <text x="765" y="304" fill="#6B7280" font-size="10">   │ is_public (boolean)</text>
  <text x="765" y="320" fill="#6B7280" font-size="10">   │ created_at / updated</text>
  <text x="765" y="336" fill="#6B7280" font-size="10">   │ prep_time / cooking_time</text>
  <text x="765" y="352" fill="#6B7280" font-size="10">   │ liked / viewed (int)</text>
  <line x1="765" y1="365" x2="1025" y2="365" stroke="#E5E7EB" stroke-width="1"/>
  <text x="765" y="382" fill="#DC2626" font-size="10" font-style="italic">⏱ No triggers on public table</text>
  <text x="765" y="398" fill="#6B7280" font-size="10">   (Updated via replication)</text>

  <!-- pending_recipes -->
  <rect x="1065" y="140" width="280" height="230" fill="white" stroke="#16A34A" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="1065" y="140" width="280" height="32" fill="#16A34A" rx="6"/>
  <rect x="1065" y="166" width="280" height="6" fill="#16A34A"/>
  <text x="1205" y="162" text-anchor="middle" fill="white" font-size="14" font-weight="bold">pending_recipes</text>
  <text x="1075" y="192" fill="#1F2937" font-size="11">🔑 PK │ id (bigserial)</text>
  <text x="1075" y="208" fill="#1F2937" font-size="11">🔗 FK │ author (TEXT) → users(name)</text>
  <text x="1075" y="224" fill="#6B7280" font-size="10">   │ name (TEXT)</text>
  <text x="1075" y="240" fill="#6B7280" font-size="10">   │ ingredients (JSONB)</text>
  <text x="1075" y="256" fill="#6B7280" font-size="10">   │ diet (TEXT)</text>
  <text x="1075" y="272" fill="#6B7280" font-size="10">   │ status (TEXT) — pending/approved</text>
  <text x="1075" y="288" fill="#6B7280" font-size="10">   │ submitted_at (timestamptz)</text>
  <text x="1075" y="304" fill="#6B7280" font-size="10">   │ prep_time / cooking_time</text>
  <line x1="1075" y1="318" x2="1335" y2="318" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1075" y="336" fill="#DC2626" font-size="10" font-style="italic">⏱ ON DELETE CASCADE to users</text>

  <!-- user_info -->
  <rect x="755" y="450" width="280" height="190" fill="white" stroke="#16A34A" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <rect x="755" y="450" width="280" height="32" fill="#16A34A" rx="6"/>
  <rect x="755" y="476" width="280" height="6" fill="#16A34A"/>
  <text x="895" y="472" text-anchor="middle" fill="white" font-size="14" font-weight="bold">user_info</text>
  <text x="765" y="502" fill="#1F2937" font-size="11">🔑 PK │ id (bigserial)</text>
  <text x="765" y="518" fill="#1F2937" font-size="11">🔗 FK │ name (TEXT) → users(name)</text>
  <text x="765" y="534" fill="#6B7280" font-size="10">   │ liked (int[])</text>
  <text x="765" y="550" fill="#6B7280" font-size="10">   │ viewed (int[])</text>
  <text x="765" y="566" fill="#6B7280" font-size="10">   │ last_login (timestamptz)</text>
  <text x="765" y="582" fill="#6B7280" font-size="10">   │ is_active (boolean)</text>
  <text x="765" y="598" fill="#6B7280" font-size="10">   │ avatar (TEXT)</text>

  <!-- ==================== RELATIONSHIP LINES ==================== -->

  <!-- users → all_recipes (dev_dba) author FK -->
  <line x1="335" y1="300" x2="365" y2="464" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)"/>

  <!-- users → public.all_recipes author FK -->
  <path d="M 335 280 Q 500 270 650 270 L 755 270" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>

  <!-- users → pending_recipes author FK -->
  <path d="M 335 260 Q 700 250 900 250 L 1065 208" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)" stroke-dasharray="5,3"/>

  <!-- users → user_info FK -->
  <path d="M 335 320 Q 500 330 650 518 L 755 518" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>

  <!-- recipe_ingredients → all_recipes (dev_dba) -->
  <line x1="335" y1="510" x2="365" y2="430" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)"/>

  <!-- recipe_ingredients → ingredients -->
  <path d="M 335 480 Q 450 470 500 350 L 505 350" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#arrowhead-blue)"/>

  <!-- dev_dba.all_recipes → public.all_recipes replication -->
  <path d="M 645 500 Q 690 500 700 280 L 755 280" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)" stroke-dasharray="8,4"/>
  <rect x="660" y="375" width="90" height="30" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" rx="4"/>
  <text x="705" y="395" text-anchor="middle" fill="#DC2626" font-size="9" font-weight="bold">REPLICATE</text>

  <!-- ==================== TRIGGER FLOW SECTION ==================== -->

  <rect x="55" y="860" width="1315" height="190" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <text x="700" y="885" text-anchor="middle" fill="#92400E" font-size="14" font-weight="bold">⚡ TRIGGER EXECUTION FLOW</text>
  <line x1="100" y1="895" x2="1320" y2="895" stroke="#D97706" stroke-width="1"/>

  <!-- Flow boxes -->
  <rect x="80" y="910" width="220" height="55" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="6"/>
  <text x="190" y="932" text-anchor="middle" fill="#DC2626" font-size="10" font-weight="bold">ON dev_dba.ingredients</text>
  <text x="190" y="948" text-anchor="middle" fill="#7F1D1D" font-size="9">BEFORE INSERT/UPDATE</text>
  <text x="190" y="962" text-anchor="middle" fill="#7F1D1D" font-size="9">set_updated_timestamp</text>

  <rect x="380" y="910" width="220" height="55" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="6"/>
  <text x="490" y="932" text-anchor="middle" fill="#DC2626" font-size="10" font-weight="bold">ON dev_dba.all_recipes</text>
  <text x="490" y="948" text-anchor="middle" fill="#7F1D1D" font-size="9">AFTER UPDATE</text>
  <text x="490" y="962" text-anchor="middle" fill="#7F1D1D" font-size="9">trigger_replicate_all_recipes_update</text>

  <rect x="680" y="910" width="220" height="55" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" rx="6"/>
  <text x="790" y="932" text-anchor="middle" fill="#DC2626" font-size="10" font-weight="bold">ON dev_dba.all_recipes</text>
  <text x="790" y="948" text-anchor="middle" fill="#7F1D1D" font-size="9">AFTER UPDATE (WHEN is_public)</text>
  <text x="790" y="962" text-anchor="middle" fill="#7F1D1D" font-size="9">on_approval</text>

  <!-- Arrows between flow boxes -->
  <line x1="300" y1="937" x2="380" y2="937" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <line x1="600" y1="937" x2="680" y2="937" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>

  <!-- Output arrows -->
  <path d="M 190 965 L 190 990 L 1050 990 L 1050 1025" stroke="#DC2626" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-red)"/>
  <path d="M 790 965 L 790 990 L 1050 990" stroke="#DC2626" stroke-width="1.5" fill="none"/>

  <!-- Destination box -->
  <rect x="920" y="1025" width="260" height="30" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="6"/>
  <text x="1050" y="1045" text-anchor="middle" fill="#065F46" font-size="11" font-weight="bold">→ public.all_recipes (INSERT/UPDATE)</text>

  <!-- Legend -->
  <rect x="100" y="1030" width="350" height="40" fill="white" stroke="#D1D5DB" stroke-width="1" rx="4"/>
  <line x1="110" y1="1050" x2="140" y2="1050" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="150" y="1055" fill="#4B5563" font-size="9">Foreign Key (dev_dba)</text>
  <line x1="280" y1="1050" x2="310" y2="1050" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="320" y="1055" fill="#4B5563" font-size="9">Foreign Key (public)</text>
  <line x1="430" y1="1050" x2="460" y2="1050" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowhead-red)"/>
  <text x="470" y="1055" fill="#4B5563" font-size="9">Replication / Trigger</text>

</svg>